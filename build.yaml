# Plugin metadata for Jellyfin Plugin Repository Manager (JPRM) packaging
name: "Shoal AI"
guid: "5f260705-cb7c-4fee-8324-b40202261739"
version: "0.1.0.0"
targetAbi: "12.1.0.0"
framework: "net10.0"
owner: "chrisgrulau"
overview: "Optional, budget-controlled AI help for the Ingest and Subtitles plugins."
description: >
  Gives the other plugins in the family optional access to AI models (Anthropic Claude by default; OpenAI, Google and
  OpenAI-compatible services such as a local server), for decisions they can't make on their own. Nothing uses it until
  you allow it; spending limits apply overall and per provider, in your own currency.
category: "General"
artifacts:
  - "Jellyfin.Plugin.Ai.dll"
  - "Anthropic.dll"
  - "Microsoft.Extensions.AI.Abstractions.dll"
changelog: >
  First release. Claude through the official SDK (default Claude Opus 5.5), metered against overall and per-provider
  monthly limits in your currency; a Claude prepaid-credit countdown; an in-process entry point so Ingest and
  Subtitles can ask for help, each only when allowed on this page and only for its own purposes.
